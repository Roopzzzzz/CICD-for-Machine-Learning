name: ML Continuous Integration and Deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install

      - name: Train model
        run: make train

      - name: Generate evaluation report
        run: |
          echo "=== Model Evaluation ==="
          cat results/metrics.txt

      - name: Inject Model Into Web Layout and Deploy
        if: github.event_name != 'pull_request'
        run: |
          # Read the generated text string directly from our results folder
          B64_DATA=$(cat results/model_b64.txt)
          
          # Inject the base64 payload cleanly directly into index.html structure
          sed -i "s|BASE64_MODEL_PLACEHOLDER|$B64_DATA|g" app/index.html
          
          # Run official cloud asset sync upward
          python -m pip install --upgrade huggingface_hub
          python -c "
          import os
          from huggingface_hub import HfApi
          
          token_val = '${{ secrets.HF_TOKEN }}'
          space_val = '${{ secrets.HF_SPACE_ID }}'
          
          api = HfApi(token=token_val)
          
          print(f'Uploading compilation directly to: {space_val}')
          api.upload_folder(folder_path='app', repo_id=space_val, repo_type='space')
          api.upload_folder(folder_path='results', path_in_repo='results', repo_id=space_val, repo_type='space')
          print('Inline distribution deployed successfully!')
          "
