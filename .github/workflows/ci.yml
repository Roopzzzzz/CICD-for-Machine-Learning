name: ML Continuous Integration and Deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install

      - name: Train model
        run: make train

      - name: Generate evaluation report
        run: |
          echo "=== Model Evaluation ==="
          cat results/metrics.txt

      - name: Deploy to Hugging Face Static Space
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python -m pip install --upgrade huggingface_hub
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          space_id = os.environ['HF_SPACE_ID']
          print(f'Uploading app directory to {space_id}...')
          api.upload_folder(folder_path='app', repo_id=space_id, repo_type='space')
          print(f'Uploading model directory to {space_id}...')
          api.upload_folder(folder_path='model', path_in_repo='model', repo_id=space_id, repo_type='space')
          print(f'Uploading results directory to {space_id}...')
          api.upload_folder(folder_path='results', path_in_repo='results', repo_id=space_id, repo_type='space')
          print('Deployment successful!')
          "
